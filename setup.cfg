[tool:pytest]
addopts = -p tdd_guard_pytest
# tdd_guard_project_root intentionally unset (BP-15 S2 / §16 F-05): the plugin
# then stores under the repo-root-relative .claude/tdd-guard/data, which is the
# identical target when pytest is run from the repo root (the standard
# `.venv/bin/python -m pytest`). Removing the hardcoded absolute path makes this
# config portable across machines and git worktrees. If you must run pytest from
# a subdirectory and need the guard, set an absolute tdd_guard_project_root in a
# local, uncommitted pytest.ini instead of reintroducing a machine path here.
